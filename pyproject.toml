[project]
name = "technical-task-garage-race"
version = "0.1.0"
description = "Technical task"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.1.1",
    "huggingface-hub>=0.30.0",
    "openpyxl>=3.1.5",
    "tqdm>=4.67.0",
]

[project.scripts]
garage-race = "technical_task_garage_race.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
